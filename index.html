<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WLED Race Flags</title>
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<link rel="icon" href="img/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<script>try{var t=localStorage.getItem("raceflags.theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<link rel="stylesheet" href="css/app.css?v=b441686c16">
</head>
<body>
<header>
  <h1><img class="brand-logo" src="img/icon.svg" alt="" width="38" height="38">WLED <span>Race Flags</span></h1>
  <nav id="nav">
    <a href="#/wled" data-route="wled"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></svg>WLED</a>
    <a href="#/race" data-route="race"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V3"/><rect x="5" y="4" width="14" height="9" stroke-width="1.5"/><rect x="5.0" y="4" width="3.5" height="3" fill="currentColor" stroke="none"/><rect x="12.0" y="4" width="3.5" height="3" fill="currentColor" stroke="none"/><rect x="8.5" y="7" width="3.5" height="3" fill="currentColor" stroke="none"/><rect x="15.5" y="7" width="3.5" height="3" fill="currentColor" stroke="none"/><rect x="5.0" y="10" width="3.5" height="3" fill="currentColor" stroke="none"/><rect x="12.0" y="10" width="3.5" height="3" fill="currentColor" stroke="none"/></svg>Race</a>
    <a href="#/settings" data-route="settings"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>Réglages</a>
  </nav>
  <div id="flag-badge" class="flag idle">arrêté</div>
</header>
<main>
  <section class="view" data-view="wled" hidden>
    <h2>Appareils WLED</h2>
    <p class="notice local-access-notice" role="status" hidden></p>
    <div id="devices-panel">
      <p class="hint">Cochez les appareils à piloter. Ils sont enregistrés dans ce navigateur et reçoivent tous les drapeaux.</p>
      <table id="devices"><thead><tr><th></th><th>Nom</th><th>Adresse</th><th>État</th><th></th></tr></thead><tbody></tbody></table>
      <div class="row">
        <label>Ajouter (IP ou nom) <input id="add-host" type="text" placeholder="192.168.1.50 ou wled-xxxx.local"></label>
        <button id="btn-add">Ajouter</button>
        <button id="btn-check">Vérifier tous</button>
      </div>
      <div class="row">
        <label>Réseau <input id="scan-prefix" type="text" size="12" placeholder="192.168.1."></label>
        <label>de <input id="scan-from" type="number" min="0" max="255" style="width:4.5em"></label>
        <label>à <input id="scan-to" type="number" min="0" max="255" style="width:4.5em"></label>
        <button id="btn-scan">Scanner le réseau</button>
        <button id="btn-scan-cancel" hidden>Annuler</button>
        <span id="scan-status" class="hint"></span>
      </div>
      <div class="row">
        <button id="btn-confirm" class="primary">Utiliser cette sélection</button>
        <span id="confirm-error" class="error"></span>
      </div>
    </div>
    <div class="row" id="devices-tests">
      <span>Test :</span>
      <button class="test" data-flag="green">Vert</button>
      <button class="test" data-flag="yellow">Jaune</button>
      <button class="test" data-flag="red">Rouge</button>
      <button class="test" data-flag="chequered">Damier</button>
      <button id="btn-release">Rendre la main</button>
    </div>
  </section>

  <section class="view" data-view="race" hidden>
    <h2>Race</h2>
    <p class="notice local-access-notice" role="status" hidden></p>
    <div class="tabs" id="mode-tabs" role="tablist" aria-label="Championnat">
      <button type="button" role="tab" class="tab" data-mode="nascar" aria-selected="false" aria-label="NASCAR" title="NASCAR"><img class="logo logo-nascar" src="img/nascar.svg" alt=""></button>
      <button type="button" role="tab" class="tab" data-mode="wec" aria-selected="false" aria-label="FIA WEC" title="FIA WEC"><img class="logo logo-wec logo-mono" src="img/wec.svg" alt=""></button>
      <button type="button" role="tab" class="tab" data-mode="imsa" aria-selected="false" aria-label="IMSA" title="IMSA"><img class="logo logo-imsa" src="img/imsa.svg" alt=""></button>
    </div>
    <input id="mode" type="hidden" value="nascar">

    <div class="panel" id="panel-live">
      <h3>Live</h3>
      <div class="row">
        <label>Intervalle (s) <input id="s-pollInterval" type="number" step="0.1" min="0.2"></label>
        <label class="mode-wec">Session WEC <input id="s-sessionId" type="number" min="1" placeholder="auto"></label>
      </div>
    <div class="row mode-fixed">
      <div class="clock-field">
        <span class="name" data-tip="Horloge que votre diffusion devrait afficher avec le retard actuel. Ajustez-la en direct avec ▲ ▼ ou les flèches du clavier jusqu'à égaler votre écran, ou tapez l'heure lue puis validez (Entrée). Échap annule.">Horloge de ma diffusion</span>
        <div class="clock" id="delay-clock" role="group" aria-label="Horloge de ma diffusion">
        <div class="seg">
          <button type="button" class="step" data-step="3600" aria-label="Heures plus un" tabindex="-1">▲</button>
          <input id="delay-h" type="text" inputmode="numeric" maxlength="2" autocomplete="off" aria-label="Heures">
          <button type="button" class="step" data-step="-3600" aria-label="Heures moins un" tabindex="-1">▼</button>
        </div>
          <span class="sep">:</span>
        <div class="seg">
          <button type="button" class="step" data-step="60" aria-label="Minutes plus un" tabindex="-1">▲</button>
          <input id="delay-m" type="text" inputmode="numeric" maxlength="2" autocomplete="off" aria-label="Minutes">
          <button type="button" class="step" data-step="-60" aria-label="Minutes moins un" tabindex="-1">▼</button>
        </div>
          <span class="sep">:</span>
        <div class="seg">
          <button type="button" class="step" data-step="1" aria-label="Secondes plus un" tabindex="-1">▲</button>
          <input id="delay-s" type="text" inputmode="numeric" maxlength="2" autocomplete="off" aria-label="Secondes">
          <button type="button" class="step" data-step="-1" aria-label="Secondes moins un" tabindex="-1">▼</button>
        </div>
        </div>
      </div>
      <label>Type d'horloge
        <select id="delay-ref-kind"><option value="remaining">Temps restant</option><option value="elapsed">Temps écoulé</option></select></label>
      <input id="fixed-delay" type="hidden" value="0">
      <span id="delay-msg" class="hint" role="status"></span>
    </div>
    <div class="row mode-nascar">
      <label class="check"><input id="tv-enabled" type="checkbox"> Synchroniser avec la TV</label>
      <label>Tour affiché à la TV <input id="tv-lap" type="number" min="1" step="1"></label>
    </div>
      <div class="row">
        <label class="check"><input id="rec-enabled" type="checkbox"> Enregistrer les changements de drapeau</label>
      </div>
      <div class="row">
        <button id="btn-start-live" class="primary">Démarrer le live</button>
      </div>
    </div>

    <div class="panel" id="panel-replay">
      <h3>Replay</h3>
      <div class="row mode-nascar">
        <label><span class="name" data-tip="Archive NASCAR : la course est téléchargée depuis l'archive officielle. Fichier : un enregistrement JSON gardé sur votre ordinateur.">Source du replay</span>
          <select id="replay-source"><option value="archive">Archive NASCAR</option><option value="file">Fichier</option></select></label>
      </div>
      <div class="row mode-nascar arc-only">
        <label><span class="name" data-tip="Saison des courses proposées dans le menu.">Année</span> <input id="arc-year" type="number" min="2000" max="2100" style="width:6.5em"></label>
        <label><span class="name" data-tip="Série NASCAR : Cup, Xfinity ou Truck.">Série</span>
          <select id="arc-series"><option value="cup">Cup</option><option value="xfinity">Xfinity</option><option value="truck">Truck</option></select></label>
        <label><span class="name" data-tip="Courses déjà parties, la plus récente d'abord. Une course apparaît environ une heure après son départ ; ses données sont publiées quelques heures après l'arrivée.">Course</span> <select id="arc-race"></select></label>
        <button id="btn-arc-download" type="button">Télécharger le fichier</button>
      </div>
      <div id="arc-status" class="hint mode-nascar arc-only" role="status"></div>
      <div class="row">
        <label class="file-only"><span class="name" data-tip="Enregistrement JSON fabriqué par l'application : enregistrement en direct ou téléchargement depuis l'archive. Il doit venir du championnat de l'onglet.">Fichier</span> <input id="replay-file" type="file" accept=".json,application/json"></label>
        <label><span class="name" data-tip="Secondes à attendre après votre clic avant que le replay démarre, au format HH:MM:SS. Utile pour lancer avant le drapeau vert de votre vidéo. 0 : démarrage immédiat.">Délai vidéo</span> <input id="replay-video" type="text" value="0" placeholder="HH:MM:SS"></label>
        <label><span class="name" data-tip="Point de la course où commence le replay, en HH:MM:SS depuis le drapeau vert. Pour reprendre en cours de course. Pour partir d'un tour, utilisez « Tour ».">Départ (temps)</span> <input id="replay-start" type="text" value="0" placeholder="HH:MM:SS"></label>
        <label><span class="name" data-tip="Numéro de tour où commence le replay, à la place du temps. 0 : on part du temps indiqué. Lancez quand votre vidéo arrive à ce tour. Pour les courses de l'archive, pas pour un enregistrement en direct.">Tour</span> <input id="replay-lap" type="number" min="0" step="1" value="0"></label>
        <label><span class="name" data-tip="Vitesse de lecture : 1 suit le temps réel, 2 va deux fois plus vite. Utile pour tester sans attendre.">Vitesse</span> <input id="replay-speed" type="number" min="0.1" step="0.1" value="1"></label>
      </div>
      <div class="row">
        <button id="btn-start-replay" class="primary" title="Lance le replay avec les réglages ci-dessus">Lancer le replay</button>
        <span id="replay-msg" class="error" role="alert"></span>
      </div>
    </div>

    <div class="row run-bar">
      <label class="check"><input id="no-wled" type="checkbox"> Sans WLED (observer seulement)</label>
      <button id="btn-stop" disabled>Arrêter</button>
      <button id="btn-download" hidden>Télécharger l'enregistrement</button>
    </div>
    <div id="progress" class="progress"></div>
  </section>

  <section class="view" data-view="settings" hidden>
    <h2>Réglages</h2>
    <div class="row">
      <label class="check switch"><input id="theme-dark" type="checkbox" role="switch"><span class="name" data-tip="Passe l'interface en thème sombre ou clair. Ce choix est mémorisé dans ce navigateur uniquement.">Thème sombre</span></label>
    </div>
      <div class="grid" id="settings-grid"></div>
      <div class="row">
        <button id="btn-export">Exporter la configuration</button>
        <label class="file">Importer <input id="import-config" type="file" accept=".json,application/json"></label>
        <button id="btn-reset">Valeurs par défaut</button>
      </div>
      <div id="settings-error" class="error"></div>
  </section>

  <section id="sec-log">
    <h2>Journal <button id="btn-clear-log" class="small">Effacer</button></h2>
    <pre id="log"></pre>
  </section>
</main>
<script defer src="js/core.js?v=b441686c16"></script>
<script defer src="js/sources/nascar.js?v=b441686c16"></script>
<script defer src="js/sources/wec.js?v=b441686c16"></script>
<script defer src="js/sources/imsa.js?v=b441686c16"></script>
<script defer src="js/sources/replay.js?v=b441686c16"></script>
<script defer src="js/sync.js?v=b441686c16"></script>
<script defer src="js/wled.js?v=b441686c16"></script>
<script defer src="js/discovery.js?v=b441686c16"></script>
<script defer src="js/settings.js?v=b441686c16"></script>
<script defer src="js/recording.js?v=b441686c16"></script>
<script defer src="js/nascar-import.js?v=b441686c16"></script>
<script defer src="js/engine.js?v=b441686c16"></script>
<script defer src="js/ui.js?v=b441686c16"></script>
</body>
</html>
